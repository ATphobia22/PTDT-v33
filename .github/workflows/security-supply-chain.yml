name: PTDT Security and Supply Chain

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project dependencies and auditors
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pip-licenses
      - name: Dependency vulnerability audit
        run: pip-audit --strict
      - name: Production license audit
        run: |
          pip-licenses --format=plain --with-urls > /tmp/licenses.txt
          if grep -Eqi 'GPL|AGPL|SSPL|Commons Clause' /tmp/licenses.txt; then
            cat /tmp/licenses.txt
            exit 1
          fi

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate CycloneDX SBOM
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            anchore/syft:v1.50.0 \
            /src -o cyclonedx-json > sbom.cdx.json
      - name: Validate SBOM exists
        run: test -s sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: ptdt-sbom
          path: sbom.cdx.json
          retention-days: 14
