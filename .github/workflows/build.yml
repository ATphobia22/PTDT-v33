name: Build and Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  node-build:
    name: Node lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply MapComponent Bonebank wire
        run: python3 scripts/apply_mapcomponent_bonebank_wire.py

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

  archimedes-sidecar:
    name: Archimedes Python sidecar syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sidecar deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements-archimedes.txt

      - name: Import / constant check
        run: |
          python -c "
import ast, pathlib
p = pathlib.Path('services/archimedes_api.py')
ast.parse(p.read_text())
assert 'BFE_FT = 375.0' in p.read_text()
assert 'ILLUSTRATIVE' in p.read_text()
print('archimedes_api.py OK')
"

      - name: Compile check
        run: python -m py_compile services/archimedes_api.py
