name: Build and Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  node-build:
    name: Node lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply MapComponent Bonebank wire
        run: python3 scripts/apply_mapcomponent_bonebank_wire.py

      - name: Commit wired MapComponent if changed (main only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MapComponent.tsx
          if git diff --staged --quiet; then
            echo "MapComponent already wired"
          else
            git commit -m "feat: MapComponent Bonebank terrain boot (CI auto-wire)"
            git push
          fi

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

  archimedes-sidecar:
    name: Archimedes Python sidecar syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sidecar deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements-archimedes.txt

      - name: Compile + constant check
        run: |
          python -m py_compile services/archimedes_api.py
          python -c "from pathlib import Path; t=Path('services/archimedes_api.py').read_text(); assert 'BFE_FT = 375.0' in t and 'ILLUSTRATIVE' in t"
