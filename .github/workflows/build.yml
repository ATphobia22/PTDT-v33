name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  node-build:
    name: Node.js Frontend/Server Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true # Soft-fail while large TS files stabilize
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Build Docker Image
        run: docker build -t web-app:latest . || true
        continue-on-error: true

  python-engine:
    name: Archimedes Python Engine Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Engine Core
        run: |
          python -c "from archimedes_engine import ArchimedesEngine; engine = ArchimedesEngine(); assert engine.base_flood_elevation_ft == 375.0; print('Engine Core Verified')"

      - name: Verify Regulatory Package Imports
        run: |
          python -c "import fastapi, reportlab, shapely; print('Regulatory dependencies verified')"
