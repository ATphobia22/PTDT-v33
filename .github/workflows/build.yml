name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint is non-blocking while large TS components are stabilized
      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

      - name: Build Docker Image
        run: docker build -t my-app:latest .
        continue-on-error: true

  python-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Archimedes dependencies
        run: pip install -r requirements.txt

      - name: Verify Archimedes engine imports
        run: |
          python -c "from archimedes_engine import ArchimedesEngine, generate_unified_regulatory_package; e=ArchimedesEngine(); print('LAG', e.lowest_adjacent_grade_ft, 'BFE', e.base_flood_elevation_ft); print('OK')"
