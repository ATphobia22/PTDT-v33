name: PTDT Sovereign CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  invariants-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.integrations.txt
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest httpx
      - name: Datum + spatial unit checks
        run: |
          python - <<'PY'
          from backend.hydraulic.vertical_datum import DatumToken, ElevationSample, VerticalDatumEnforcer
          from backend.spatial.normalization import ProjectedPoint, SpatialNormalizationEngine
          from backend.core.v34_sovereign_constants import DATUM, CRS, BFE_NAVD88_FT
          assert DATUM == "NAVD88"
          assert CRS == "EPSG:2966"
          assert VerticalDatumEnforcer().to_navd88(ElevationSample(375.0, DatumToken.NAVD88, "test")).status == "VALID"
          s = SpatialNormalizationEngine()
          local = s.project_to_local(ProjectedPoint(s.origin_e + 10, s.origin_n + 20, BFE_NAVD88_FT))
          assert abs(local.x_m - 10) < 1e-9 and abs(local.y_m - 20) < 1e-9
          PY
      - name: FastAPI contract checks
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.main import app
          client = TestClient(app)
          health = client.get("/api/v1/health")
          assert health.status_code == 200, health.text
          inv = client.get("/api/v1/invariants")
          assert inv.status_code == 200, inv.text
          body = inv.json()
          assert body.get("datum") == "NAVD88"
          assert body.get("crs") == "EPSG:2966"
          PY
      - name: v35 core and integration tests
        run: pytest -q tests/test_v35_core.py tests/test_transport_integrations.py
      - name: Compile gRPC contract
        run: |
          mkdir -p /tmp/ptdt_grpc
          python -m grpc_tools.protoc -I protobuf --python_out=/tmp/ptdt_grpc --grpc_python_out=/tmp/ptdt_grpc protobuf/spatial_stream.proto
          test -s /tmp/ptdt_grpc/spatial_stream_pb2.py
          test -s /tmp/ptdt_grpc/spatial_stream_pb2_grpc.py
      - name: Python syntax scan
        run: python -m compileall -q backend ptdt_v35_core tests
      - name: Docker build
        if: github.event_name == 'push'
        run: docker build -t ptdt-api:ci .
