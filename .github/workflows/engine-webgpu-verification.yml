name: PTDT Engine/WebGPU Integration Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webgpu-shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate WGSL syntax and reflection
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save wgsl_reflect@1.5.0 >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { WgslReflect } from 'wgsl_reflect/wgsl_reflect.module.js';
          const roots = ['web', 'frontend', 'engine', 'adapters'];
          const shaders = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (p.endsWith('.wgsl')) shaders.push(p);
            }
          }
          roots.forEach(walk);
          if (!shaders.length) throw new Error('No WGSL shaders found');
          for (const file of shaders) {
            const source = fs.readFileSync(file, 'utf8');
            const reflect = new WgslReflect(source);
            if (!reflect.entry) throw new Error(`WGSL reflection failed: ${file}`);
          }
          NODE

  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install v35 core dependencies
        run: python -m pip install -r ptdt_v35_core/requirements.txt pytest ruff
      - name: Test v35 core
        run: PYTHONPATH=. pytest -q tests/ptdt_v35_core
      - name: Lint and compile adapters/core
        run: |
          python -m compileall -q ptdt_v35_core adapters/engine/core
          ruff check ptdt_v35_core tests/ptdt_v35_core adapters/engine/core

  engine-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate canonical engine contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from adapters.engine.core.scene_state import SceneState
          p = Path('adapters/engine/core/EngineFrameContract.json')
          c = json.loads(p.read_text())
          assert c['schema'] == 'ptdt.engine.frame.v2'
          assert c['coordinate_reference'] == 'EPSG:2966'
          assert c['vertical_reference'] == 'NAVD88'
          assert c['evidence'] == 'RFC8785-SHA256'
          assert 'authority_snapshot_id' in c['required']
          assert Path('adapters/engine/unity/PTDTEngineFrame.cs').exists()
          assert Path('adapters/engine/unreal/PTDTEngineFrame.hpp').exists()
          state = SceneState.from_mapping({
              'frame_id': 'ci',
              'authority_snapshot_id': 'snapshot',
              'timestamp_utc': '2026-08-16T15:00:00Z',
              'crs': 'EPSG:2966',
              'vertical_datum': 'NAVD88',
              'render_origin': [0.0, 0.0, 0.0],
              'content_hash': 'a' * 64,
              'validation_status': 'VALID',
          })
          assert state.to_mapping()['vertical_datum'] == 'NAVD88'
          PY
