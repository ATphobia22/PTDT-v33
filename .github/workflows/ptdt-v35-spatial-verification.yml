name: PTDT v35 Spatial Verification

on:
  push:
    branches: [main, 'feature/**', 'integration/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-spatial:
    name: Python spatial contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q ptdt_v35_core engine
      - name: Run spatial contract tests
        run: pytest -q tests/ptdt_v35_core
      - name: Validate Spatial Tile JSON schema syntax
        run: python -m json.tool schemas/ptdt_spatial_tile.schema.json >/dev/null

  frontend-contract:
    name: Frontend TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  keyless-policy:
    name: Keyless core policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject mandatory API-key configuration in core adapter contracts
        run: |
          ! grep -RniE 'required[_-]?api[_-]?key|mandatory[_-]?api[_-]?key|OPENAI_API_KEY|GOOGLE_API_KEY' ptdt_v35_core adapters schemas
