<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Node: Flood Defense Simulator</title>
    <!-- CesiumJS Core dependencies -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #000; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        #cesiumContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #controls {
            position: absolute; top: 20px; right: 20px; width: 340px; z-index: 10;
            background: rgba(15, 23, 42, 0.9); border: 1px solid #0ea5e9;
            padding: 20px; border-radius: 8px; box-shadow: 0 0 20px rgba(14, 165, 233, 0.3);
            backdrop-filter: blur(10px);
        }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #cbd5e1; }
        input[type=range] { width: 100%; margin: 15px 0; accent-color: #0ea5e9; }
        .status-safe { color: #10b981; font-weight: bold; text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .status-danger { color: #ef4444; font-weight: bold; animation: blink 1s infinite; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
<div id="controls">
    <h2 class="text-sm font-bold text-white uppercase tracking-widest border-b border-sky-500 pb-2 mb-4 flex items-center justify-between">
        Archimedes Defense Console
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
    </h2>
    <div class="data-row">
        <span>WABASH (New Harmony):</span>
        <span id="wabashLevel" class="text-sky-400 font-bold">6.55 ft</span>
    </div>
    <div class="data-row">
        <span>OHIO (Myers Dam):</span>
        <span id="ohioLevel" class="text-sky-400 font-bold">18.32 ft</span>
    </div>
    <hr class="border-slate-700 my-4">
    <label class="text-xs font-bold text-slate-300 uppercase block mb-1">
        SIMULATED FLOOD STAGE: <span id="floodVal" class="text-white text-sm ml-2">370.0</span> ft MSL
    </label>
    <input type="range" id="floodSlider" min="360" max="385" step="0.5" value="370">
    <div class="data-row mt-4 pt-3 border-t border-slate-700 items-center">
        <span>IMPACT STATUS:</span>
        <span id="statusText" class="status-safe text-lg">SECURE</span>
    </div>
    <div class="text-[10px] text-slate-500 mt-2 text-right">Property Grade (LAG): 377.2 ft</div>
</div>
<div id="cesiumContainer"></div>
<script>
    // NOTE: For full photorealistic tiles to load in production, replace with your Cesium Ion Token
    Cesium.Ion.defaultAccessToken = 'YOUR_CESIUM_ION_ACCESS_TOKEN_HERE';
    const viewer = new Cesium.Viewer('cesiumContainer', {
        terrainProvider: Cesium.createWorldTerrain(),
        globe: true, timeline: false, animation: false,
        baseLayerPicker: false, sceneModePicker: false,
        selectionIndicator: false, infoBox: false, geocoder: false,
        homeButton: false, navigationHelpButton: false
    });

    // Bonebank Road Coordinates
    const bonebankLon = -88.0051;
    const bonebankLat = 37.8459;

    // 1. Load the "Material Truth" (Google 3D Tiles fallback via OSM Buildings if token missing)
    try {
        const buildingTileset = viewer.scene.primitives.add(Cesium.createOsmBuildings());
    } catch (e) {
        console.error(e);
    }

    // Fly to 13101 Bonebank Rd
    viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(bonebankLon, bonebankLat, 600),
        orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 },
        duration: 3.0
    });

    // 2. The Flood Plane (Blue Polygon representing water level)
    // Ensure extrusion height updates dynamically based on the slider
    const floodEntity = viewer.entities.add({
        name: 'Simulated Flood Event',
        polygon: {
            hierarchy: Cesium.Cartesian3.fromDegreesArray([
                bonebankLon - 0.02, bonebankLat - 0.02,
                bonebankLon + 0.02, bonebankLat - 0.02,
                bonebankLon + 0.02, bonebankLat + 0.02,
                bonebankLon - 0.02, bonebankLat + 0.02
            ]),
            extrudedHeight: 370.0 * 0.3048, // Start at 370ft in meters
            height: 100.0, // Base level below terrain
            material: new Cesium.ColorMaterialProperty(Cesium.Color.CORNFLOWERBLUE.withAlpha(0.6)),
            outline: false
        }
    });

    // 3. The "Archimedes Line" (Your Berm Defense)
    viewer.entities.add({
        name: 'Archimedes Berm',
        wall: {
            positions: Cesium.Cartesian3.fromDegreesArray([
                bonebankLon - 0.001, bonebankLat - 0.001,
                bonebankLon + 0.001, bonebankLat - 0.001,
                bonebankLon + 0.001, bonebankLat + 0.001,
                bonebankLon - 0.001, bonebankLat + 0.001,
                bonebankLon - 0.001, bonebankLat - 0.001
            ]),
            maximumHeights: [115, 115, 115, 115, 115], // Approx 377.2 ft MSL (in meters)
            minimumHeights: [112, 112, 112, 112, 112],
            material: new Cesium.ColorMaterialProperty(Cesium.Color.EMERALD.withAlpha(0.7)),
            outline: true,
            outlineColor: Cesium.Color.WHITE
        }
    });

    // 4. Interactive Simulation Logic
    const slider = document.getElementById('floodSlider');
    const floodVal = document.getElementById('floodVal');
    const statusText = document.getElementById('statusText');

    slider.addEventListener('input', function() {
        const feet = parseFloat(this.value);
        const meters = feet * 0.3048;
        floodVal.innerText = feet.toFixed(1);

        // Dynamically update the water height in Cesium
        floodEntity.polygon.extrudedHeight = new Cesium.CallbackProperty(() => meters, false);

        // Logic: Property Lowest Adjacent Grade (LAG) is 377.2 ft.
        if (feet > 377.2) {
            statusText.innerText = "BREACH DETECTED";
            statusText.className = "status-danger text-lg";
        } else if (feet >= 375.0) {
            statusText.innerText = "BFE EXCEEDED (SAFE)";
            statusText.className = "text-amber-400 font-bold text-lg";
        } else {
            statusText.innerText = "SECURE";
            statusText.className = "status-safe text-lg";
        }
    });
</script>
</body>
</html>
