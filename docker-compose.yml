version: '3.8'
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - archimedes

  archimedes:
    build:
      context: .
      dockerfile: environment/Dockerfile
    ports:
      - "8000:8000"
    command: python3 archimedes_engine.py
    volumes:
      - .:/app
    working_dir: /app
