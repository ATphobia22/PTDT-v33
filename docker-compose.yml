services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PTDT_DATUM=NAVD88
      - PTDT_CRS=EPSG:2966
      - PTDT_FAIL_CLOSED=1
    volumes:
      - ./data:/app/data:ro
      - ./render_output:/app/render_output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
