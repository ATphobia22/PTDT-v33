# Optional local stack — set secrets via environment; do not commit real passwords.
version: "3.8"

services:
  ptdt-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

